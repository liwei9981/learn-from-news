[project]
name = "learn-from-news"
version = "0.1.0"
description = "Telegram-first news learning workflow powered by NotebookLM."
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.110.0",
    "feedparser>=6.0.11",
    "googlenewsdecoder>=0.1.7",
    "notebooklm-py[browser]>=0.3.4",
    "google-genai>=1.0.0",
    "openai>=1.40.0",
    "playwright>=1.45.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "python-telegram-bot>=21.4",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
